# Local server for ./deploy/public (the CV published to Firebase Hosting).
# Mirrors firebase.json: existing files are served as-is and every other path
# is rewritten to /index.html.
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # The folder is a bind mount from the host; sendfile can serve stale or
    # truncated content after the Rails jobs rewrite data.json.
    sendfile off;

    location / {
        try_files $uri /index.html;
    }
}
